# Development only: persisted locally, not exposed through an H2 web console.
# The location is relative to the launch working directory and is ignored by Git.
spring.datasource.url=jdbc:h2:file:./.process-admin/data;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chenile-process-outbox-schema.sql,classpath:chenile-process-work-schema.sql
