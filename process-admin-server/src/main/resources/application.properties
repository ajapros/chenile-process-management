spring.application.name=process-admin-server
server.address=${PROCESS_ADMIN_BIND_ADDRESS:127.0.0.1}
server.port=${PROCESS_ADMIN_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Without an explicit dev profile, an operator-supplied database is required.
spring.datasource.url=${PROCESS_DATABASE_URL:}
spring.datasource.username=${PROCESS_DATABASE_USERNAME:}
spring.datasource.password=${PROCESS_DATABASE_PASSWORD:}
spring.datasource.hikari.auto-commit=false

chenile.properties=process-admin-chenile.properties
chenile.process.management.enabled=true
chenile.process.management.api-key=${PROCESS_MANAGEMENT_API_KEY:}
# Protect the workflow controllers too: no alternate unauthenticated process ingress.
chenile.process.management.protect-all-http-routes=true
chenile.process.configurator=database
chenile.process.outbox.enabled=true
chenile.process.worker.jdbc.run-worker=false
chenile.process.worker.jdbc.run-once=false

# Do not log arguments or administrator headers through external API logging.
chenile.external-api.logging.enabled=false
